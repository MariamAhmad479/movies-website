<!DOCTYPE html>
<html lang="en">
    <html>
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MyMovie</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="swiper-bundle.min.css">
        <link rel="shortcut icon" href="movies icon.png" types="image/x-icon">
        <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        </style>
    </head>
    <body>
        <header>
            <div class="nav container">
                <a href="main.html" class="logo">
                    My<span>Movie</span>
                </a>
                <img src="movies icon.png" href="main.html" alt="" class="home-icon">
                <a href="#" class="user">
                    <img src="user1.png" alt="" class="user-img">
                </a>
                <div class="navbar">
                    <a href="main.html" class="navlink">
                        <i class='bx bx-home' ></i>
                        <span class="navtitle">Home</span>
                    </a>
                    <a href="trending.html" class="navlink">
                        <i class='bx bx-trending-up' ></i>
                        <span class="navtitle">Trending</span>
                    </a>
                    <a href="explore.html" class="navlink">
                        <i class='bx bx-compass' ></i>
                        <span class="navtitle">Explore</span>
                    </a>
                    <a href="watchlist.html" class="navlink">
                        <i class='bx bx-list-ul' ></i>
                        <span class="navtitle">Watchlist</span>
                    </a>
                    <a href="contact.html" class="navlink">
                        <i class='bx bxs-contact' ></i>
                        <span class="navtitle">Contact Us</span>
                    </a>
                </div>
            </div>
        </header>
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                // Get user information from storage
                const user = JSON.parse(localStorage.getItem('user')) || JSON.parse(sessionStorage.getItem('loggedInUser'));
    
                if (user) {
                    const userDetailsDiv = document.getElementById('userDetails');
                    userDetailsDiv.innerHTML = `
                        <p><strong>Username:</strong> ${user.username || 'Not available'}</p>
                        <p><strong>Email:</strong> ${user.email || 'Not available'}</p>
                    `;
                } else {
                    document.getElementById('userDetails').innerHTML = '<p>No user data found.</p>';
                }
            });
        </script>
    </body>
    <footer>
        <div class="container">
            <p>&copy; 2024 MyMovie. All rights reserved.</p>
        </div>
    </footer>
    </html>
