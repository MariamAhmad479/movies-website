<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MyMovie</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="swiper-bundle.min.css">
        <link rel="shortcut icon" href="movies icon.png" types="image/x-icon">
        <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        </style>
    </head>
<body>
    <header>
        <div class="nav container">
            <a href="main.html" class="logo">
                My<span>Movie</span>
            </a>
            <img src="movies icon.png" href="main.html" alt="" class="home-icon">
            <div class="search-box">
                <input type="search" name="" id="search-input" placeholder="Search movie">
                <i class='bx bx-search'></i>
            </div>
            <a href="user.html" class="user">
                <img src="user1.png" alt="" class="user-img">
            </a>
            <div class="navbar">
                <a href="main.html" class="navlink">
                    <i class='bx bx-home' ></i>
                    <span class="navtitle">Home</span>
                </a>
                <a href="trending.html" class="navlink">
                    <i class='bx bx-trending-up' ></i>
                    <span class="navtitle">Trending</span>
                </a>
                <a href="explore.html" class="navlink">
                    <i class='bx bx-compass' ></i>
                    <span class="navtitle">Explore</span>
                </a>
                <a href="watchlist.html" class="navlink">
                    <i class='bx bx-list-ul' ></i>
                    <span class="navtitle">Watchlist</span>
                </a>
                <a href="contact.html" class="navlink">
                    <i class='bx bxs-contact' ></i>
                    <span class="navtitle">Contact Us</span>
                </a>
            </div>
        </div>
    </header>

    <main class="container">
        <h2>Contact Us</h2>
        <form id="contact-form" action="#">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Message:</label>
            <textarea id="message" name="message" required></textarea>

            <button type="submit">Send Message</button>
        </form>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 MyMovie. All rights reserved.</p>
        </div>
    </footer>

    <script src="main.js"></script>
</body>
</html>
