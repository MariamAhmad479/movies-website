<!DOCTYPE html>
<html lang="en">
    <html>
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MyMovie</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="swiper-bundle.min.css">
        <link rel="shortcut icon" href="movies icon.png" types="image/x-icon">
        <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        </style>
    </head>
    <body>
        <header>
            <div class="nav container">
                <a href="main.html" class="logo">
                    My<span>Movie</span>
                </a>
                <img src="movies icon.png" href="main.html" alt="" class="home-icon">
            </div>
        </header>
<div class="container">
    <form id="form" action="/">
        <h1>Registration</h1>
        <div class="input">
            <label for="username">Username:</label>
            <input id="username" name="username" type="text" required>
            <div class="error"></div>
        </div>

        <div class="input">
            <label for="email">Email:</label>
            <input id="email" name="email" type="email" required>
            <div class="error"></div>
        </div>

        <div class="input">
            <label for="password">Password:</label>
            <input id="password" name="password" type="password" required>
            <div class="error"></div>
        </div>

        <div class="input">
            <label for="password">Confirm Password:</label>
            <input id="password2" name="password2" type="password" required>
            <div class="error"></div>
        </div>

        <button type="submit" class="submit">Sign Up</button>

    </form>

</div>

<script>
    const form = document.getElementById('form');
    const username = document.getElementById('username');
    const email = document.getElementById('email');
    const password = document.getElementById('password');
    const password2 = document.getElementById('password2');

    

    const setError = (element, message) => {
        const inputControl = element.parentElement;
        const errorDisplay = inputControl.querySelector('.error');
        errorDisplay.innerText = message;
        inputControl.classList.add('error');
        inputControl.classList.remove('success');
    }

    const setSuccess = element => {
        const inputControl = element.parentElement;
        const errorDisplay = inputControl.querySelector('.error');
        errorDisplay.innerText = '';
        inputControl.classList.add('success');
        inputControl.classList.remove('error');
    }

    const validateInputs = () => {
        const usernameValue = username.value.trim();
        const emailValue = email.value.trim();
        const passwordValue = password.value.trim();
        const password2Value = password2.value.trim();
        let isValid = true; // Assume inputs are valid initially

        if (usernameValue === '') {
            setError(username, 'Username is required');
            isValid = false; // Set to false if there is an error
        } else {
            setSuccess(username);
        }

        if (emailValue === '') {
            setError(email, 'Email is required');
            isValid = false;
        } else {
            setSuccess(email);
        }

        if (passwordValue === '') {
            setError(password, 'Password is required');
            isValid = false;
        } else if (passwordValue.length < 8) {
            setError(password, 'Password must be at least 8 characters.');
            isValid = false;
        } else {
            setSuccess(password);
        }

        if (password2Value === '') {
            setError(password2, 'Please confirm your password');
            isValid = false;
        } else if (password2Value !== passwordValue) {
            setError(password2, 'Passwords do not match');
            isValid = false;
        } else {
            setSuccess(password2);
        }

        return isValid; // Return true only if all validations pass
    };
    form.addEventListener('submit', e => {
        e.preventDefault(); // Prevent the default form submission behavior
        const isValid = validateInputs(); // Check if inputs are valid

        if (isValid) {
            // Proceed with redirection if validation passes
            window.location.href = "main.html"; // Redirect to main.html
        }
    });
</script>
</body>

</html>
