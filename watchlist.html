<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MyMovie</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="swiper-bundle.min.css">
        <link rel="shortcut icon" href="movies icon.png" types="image/x-icon">
        <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        .watchlist-container {
            display: flex;
            flex-wrap: wrap;
        }
        .movie-item {
            margin: 10px;
            width: 200px;
        }
        .movie-item img {
            width: 100%;
        }
        .remove-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background-color: red;
            color: white;
            border: none;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            cursor: pointer;
        }
        </style>
    </head>
    <body>
        <header>
            <div class="nav container">
                <a href="main.html" class="logo">
                    My<span>Movie</span>
                </a>
                <img src="movies icon.png" href="main.html" alt="" class="home-icon">
                <div class="search-box">
                    <input type="search" name="" id="search-input" placeholder="Search movie">
                    <i class='bx bx-search'></i>
                </div>
                <a href="user.html" class="user">
                    <img src="user1.png" alt="" class="user-img">
                </a>
                <div class="navbar">
                    <a href="main.html" class="navlink">
                        <i class='bx bx-home' ></i>
                        <span class="navtitle">Home</span>
                    </a>
                    <a href="#home" class="navlink">
                        <i class='bx bx-trending-up' ></i>
                        <span class="navtitle">Trending</span>
                    </a>
                    <a href="explore.html" class="navlink">
                        <i class='bx bx-compass' ></i>
                        <span class="navtitle">Explore</span>
                    </a>
                    <a href="#watchlist.html" class="navlink">
                        <i class='bx bx-list-ul' ></i>
                        <span class="navtitle">Watchlist</span>
                    </a>
                    <a href="contact.html" class="navlink">
                        <i class='bx bxs-contact' ></i>
                        <span class="navtitle">Contact Us</span>
                    </a>
                </div>
            </div>
        </header>

        <section class="watchlist container">
            <h1>Your Watchlist</h1>
            <div class="watchlist-container" id="watchlist-container"></div>
        </section>
    
        <script>
            document.addEventListener('DOMContentLoaded', function() {
            const watchlistContainer = document.getElementById('watchlist-container');
            let watchlist = JSON.parse(localStorage.getItem('watchlist')) || [];

            function renderWatchlist() {
                watchlistContainer.innerHTML = '';
                watchlist.forEach((movie, index) => {
                    const movieItem = document.createElement('div');
                    movieItem.classList.add('movie-item');

                    movieItem.innerHTML = `
                        <img src="${movie.image}" alt="${movie.title}">
                        <h3>${movie.title}</h3>
                        <button class="remove-btn" data-index="${index}">&times;</button>
                    `;

                    watchlistContainer.appendChild(movieItem);
                });

                // Add event listeners for remove buttons
                const removeButtons = document.querySelectorAll('.remove-btn');
                removeButtons.forEach(button => {
                    button.addEventListener('click', function() {
                        const index = this.getAttribute('data-index');
                        watchlist.splice(index, 1);
                        localStorage.setItem('watchlist', JSON.stringify(watchlist));
                        renderWatchlist(); // Re-render the watchlist
                    });
                });
            }

            renderWatchlist();
        });
        </script>
    </body>
